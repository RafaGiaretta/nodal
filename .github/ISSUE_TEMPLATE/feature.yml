name: Sugestão
description: Proponha uma melhoria ou funcionalidade
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual problema isso resolve
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Proposta
      description: Como você imagina a solução.
    validations:
      required: true
  - type: input
    id: backlog
    attributes:
      label: Item do backlog relacionado
      placeholder: por exemplo 2.1.2.1
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
